<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Beside Image</title>
    <style>
        .container {
            display: flex;
            align-items: center;
        }
        .container img {
            margin-right: 20px; /* Space between image and text */
        }
    </style>
</head>
<body>

<div class="container">
    <img src="your-image-url.jpg" alt="Description" width="100">
    <p>This is some text beside the image.</p>
</div>

</body>
</html>
